<div class="login-container" style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f5f5f5;">
  <mat-card style="width: 400px; padding: 20px;">
    <mat-card-header>
      <mat-card-title>RARAS Asset Management</mat-card-title>
      <mat-card-subtitle>Login to your account</mat-card-subtitle>
    </mat-card-header>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; margin-top: 20px;">
      
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" placeholder="admin@raras.com">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password">
      </mat-form-field>

      <p *ngIf="errorMessage" style="color: red; font-size: 12px;">{{errorMessage}}</p>

      <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">
        LOGIN
      </button>

    </form>
  </mat-card>
</div>
